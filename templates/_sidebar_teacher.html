{% load static %}
<aside id="layout-menu" class="layout-menu menu-vertical menu bg-menu-theme">

    </a>
  </div>
  <div class="menu-inner-shadow"></div>

  <ul class="menu-inner py-1">
    <li class="menu-item {% if request.resolver_match.url_name == 'teacher_dashboard' %}active{% endif %}">

        <i class="menu-icon bx bx-home"></i> <div>Dashboard</div>

    </li>

    <li class="menu-header small text-uppercase"><span class="menu-header-text">Lớp học</span></li>

    <li class="menu-item">
      <a href="{% url 'create_classroom' %}" class="menu-link">

    <li class="menu-item">
      <a href="{% url 'exam_list' %}?tab=reports" class="menu-link">
        <i class="menu-icon bx bx-bar-chart-alt-2"></i><div>Báo cáo</div>
