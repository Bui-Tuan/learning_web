<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Modify classroom</title>
</head>
<body>
    <h2>Chỉnh sửa lớp học: {{ classroom.name }}</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
        <a href="{% url 'classroom_detail' classroom.id %}" class="btn btn-secondary">Hủy</a>
    </form>

    <form action="{% url 'delete_classroom' classroom.id %}" method="POST" style="display: inline;">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger" onclick="return confirm('Bạn chắc chắn muốn xóa lớp học?');">
            Delete Classroom
        </button>
    </form>
</body>
</html>
