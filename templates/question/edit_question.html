<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Edit question</title>
</head>
<body>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ q_form.as_p }}
    {{ formset.management_form }}

    <h4>Ảnh minh họa đề bài hiện tại:</h4>
    {% for img in images %}
        <div style="display:inline-block;margin-right:10px;">
            <img src="{{ img.image.url }}" style="max-width:100px;"><br>
            <label><input type="checkbox" name="delete_images" value="{{ img.id }}"> Xóa</label>
        </div>
    {% empty %}
        <p>Chưa có ảnh.</p>
    {% endfor %}
    <hr>
    <label>Thêm ảnh minh họa mới (nhiều ảnh):</label>
    <input type="file" name="images" multiple>

    <hr>
    <h4>Lựa chọn trả lời:</h4>
    <table>
        {% for subform in formset %}
        <tr>
            <td>{{ subform.label }}</td>
            <td>{{ subform.text }}</td>
            <td>{{ subform.image }}</td>
        </tr>
        {% endfor %}
    </table>
    <button type="submit">Lưu thay đổi</button>
</form>
</body>
</html>
